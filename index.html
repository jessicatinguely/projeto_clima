<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <!-- Página Inicial -->
    <section id="home-section" class="section">
        <h1 class="page-title"></h1>
        <div class="card">
            <h2 class="card-title">Previsão do Tempo</h2>
            <form id="weather-form">
                <input type="text" id="city-input" placeholder="Digite o nome da cidade" required>
                <button type="submit">Buscar</button>
            </form>
        </div>
    </section>

    <!-- Temperatura atual da Cidade -->
    <section id="result-section" class="section hidden">
        <h1 class="page-title"></h1>
        <div class="card result-card">
            <div class="temperature-box">
                <span id="temperature" class="temperature">21°</span>
            </div>
            <p id="city-name" class="city-name">São Paulo, Brasil</p>
            <button id="back-button" class="icon-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
                    stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-house-icon">
                    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                    <path
                        d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                </svg>
            </button>
        </div>
    </section>

    <!-- Cidade não encontrada -->
    <section id="error-section" class="section hidden">
        <h1 class="page-title"></h1>
        <div class="card">
            <h2 class="card-title">Previsão do Tempo</h2>
            <form id="error-form">
                <input type="text" id="city-input-error" placeholder="Digite o nome da cidade" required>
                <button type="submit">Buscar</button>
            </form>
            <div class="error-message">
                Cidade não encontrada. Tente novamente.
            </div>
        </div>
    </section>

    <section id="forecast-section" class="section hidden">
        <h3 class="forecast-title">Próximos Dias</h3>
        <ul id="forecast-list" class="forecast-list"></ul>
      </section>
          

    <script src="./assets/js/api.js"></script>
</body>

</html>
